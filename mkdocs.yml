# 建议替换或更新 mkdocs.yml 中的相应部分
theme:
  name: material
  language: zh  # 改为中文界面
  palette:
    # 自动切换深浅模式，使用更沉稳的配色
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs          # 顶部菜单栏
    - navigation.sections      # 侧边栏分块
    - navigation.top           # 回到顶部按钮
    - navigation.tracking      # 锚点跟踪
    - content.code.copy        # 代码复制按钮
    - navigation.path          # 面包屑导航

# 增加社交链接，放在页面底部，增加学术专业感
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PFZL423
    - icon: fontawesome/graduated-cap # 如果有 Google Scholar
      link: https://scholar.google.com/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/