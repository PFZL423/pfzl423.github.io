site_name: PFZL423
site_description: Latent World Models for Embodied AI
site_author: PFZL423

theme:
  name: material
  language: zh 
  palette:
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - navigation.path

nav:
  - Home: index.md
  - About: about.md
  - Roadmap: roadmap.md
  - Notes:
      - Embodied AI: notes/embodied-ai.md
      - Model-Based RL: notes/model-based-rl.md
      - Latent World Models: notes/latent-world-models.md
  - Projects:
      - CILD: projects/cild.md
  - Papers:
      - TD-MPC2: papers/td-mpc2.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PFZL423